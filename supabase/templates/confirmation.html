<!doctype html>
<html lang="en">
  <body style="font-family: Arial, sans-serif; color: #253b2e; background: #f7f7f0; padding: 32px">
    <h1>Confirm your email</h1>
    <p>Enter this code in Drink with Desire to finish signing up:</p>
    <p style="font-size: 32px; font-weight: bold; letter-spacing: 6px">{{ .Token }}</p>
    <p>Or continue with this link:</p>
    <p>
      <a href="{{ .RedirectTo }}&amp;token_hash={{ .TokenHash }}&amp;type=email"
        >Confirm and continue</a
      >
    </p>
    <p>If you didn’t create an account, you can ignore this email.</p>
  </body>
</html>
