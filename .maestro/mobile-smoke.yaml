# Android starter flow. Sign in with a QA account before running.
# Opens screens only; does not enable push, send messages, or submit mutations.
appId: com.dwd.app
tags:
  - smoke
---
- launchApp:
    clearState: false
- openLink: 'dwd://'
- runFlow:
    when:
      visible: 'Skip tour'
    commands:
      - tapOn: 'Skip tour'
- tapOn: 'Settings'
- assertVisible: 'Settings'
- scrollUntilVisible:
    element: 'Notifications'
    direction: DOWN
- tapOn: 'Notifications'
- assertVisible: 'Notifications'
- scrollUntilVisible:
    element: 'Inbox'
    direction: DOWN
- assertVisible: 'Inbox'
- back
- tapOn: 'Entries'
- assertVisible: 'Entries'
- tapOn: 'Tonight'
